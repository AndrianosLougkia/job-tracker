# Serves the built frontend (Dockerfile target "prod") and proxies the API to the backend.
# TLS is expected to end in front of this (a host reverse proxy or load balancer);
# see "Deploying to a server" in the README.

# "Connection: upgrade" only for WebSocket handshakes; plain keep-alive otherwise
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resume uploads are capped at 10 MB by the backend; leave room for multipart overhead
    client_max_body_size 11m;

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Analysis notifications (STOMP over WebSocket). The backend checks the Origin
    # header against WS_ALLOWED_ORIGINS, so set that to the public site URL.
    location /api/ws {
        proxy_pass http://backend:8080/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server heartbeats arrive every 10 s; this only bounds a truly dead connection
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change; index.html must always be revalidated
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router — serve index.html for all non-asset routes
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
