services:

  # ------------------------------------------------------------------ #
  #  PostgreSQL — primary database                                       #
  # ------------------------------------------------------------------ #
  postgres:
    image: postgres:16-alpine
    container_name: jobtracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jobtracker}
      POSTGRES_USER: ${DB_USERNAME:-jobtracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobtracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jobtracker} -d ${DB_NAME:-jobtracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobtracker-net

  # ------------------------------------------------------------------ #
  #  Backend — Spring Boot application                                   #
  # ------------------------------------------------------------------ #
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder          # Use the builder stage image during development for faster rebuilds
    container_name: jobtracker-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-jobtracker}
      DB_USERNAME: ${DB_USERNAME:-jobtracker}
      DB_PASSWORD: ${DB_PASSWORD:-jobtracker}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobtracker-net
    # For development: mount source and run with Maven so code changes trigger rebuild
    # In production, remove this override and use the packaged JAR
    command: >
      sh -c "cd /build && mvn spring-boot:run
             -Dspring-boot.run.profiles=docker
             -Dspring-boot.run.jvmArguments='-Xmx512m'"

  # ------------------------------------------------------------------ #
  #  Frontend — React / Vite dev server                                  #
  # ------------------------------------------------------------------ #
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: jobtracker-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src          # Hot-reload source changes
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
    networks:
      - jobtracker-net

  # ------------------------------------------------------------------ #
  #  Redis — added in Stage 9 (placeholder entry commented out)         #
  # ------------------------------------------------------------------ #
  # redis:
  #   image: redis:7-alpine
  #   ...

  # ------------------------------------------------------------------ #
  #  MinIO — added in Stage 5 (placeholder entry commented out)         #
  # ------------------------------------------------------------------ #
  # minio:
  #   image: minio/minio
  #   ...

  # ------------------------------------------------------------------ #
  #  Ollama — optional LLM server (Stage 7)                             #
  # ------------------------------------------------------------------ #
  # ollama:
  #   image: ollama/ollama
  #   profiles: [ollama]
  #   ...

volumes:
  postgres-data:

networks:
  jobtracker-net:
    driver: bridge
