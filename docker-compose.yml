services:

  postgres:
    image: postgres:16-alpine
    container_name: jobtracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jobtracker}
      POSTGRES_USER: ${DB_USERNAME:-jobtracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobtracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jobtracker} -d ${DB_NAME:-jobtracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobtracker-net

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    container_name: jobtracker-minio
    restart: unless-stopped
    command: server /data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
      - ./minio.license:/minio.license:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobtracker-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: jobtracker-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-jobtracker}
      DB_USERNAME: ${DB_USERNAME:-jobtracker}
      DB_PASSWORD: ${DB_PASSWORD:-jobtracker}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-resumes}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      # Defaults to the optional ollama service below; set to http://host.docker.internal:11434
      # in .env to use an Ollama running on the host instead.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      SERVER_PORT: 8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - jobtracker-net
    command: >
      sh -c "cd /build && mvn spring-boot:run
             -Dspring-boot.run.profiles=docker
             -Dspring-boot.run.jvmArguments='-Xmx512m'"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: jobtracker-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
    networks:
      - jobtracker-net

  # redis: (Stage 9)

  # ---- Optional local LLM: docker compose --profile ollama up ----
  # Only needed for AI_PROVIDER=ollama when Ollama is not installed on the host.
  ollama:
    image: ollama/ollama:0.35.0
    container_name: jobtracker-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    environment:
      # Keep the model in memory between analyses instead of reloading it each time
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobtracker-net

  # One-shot job that downloads OLLAMA_MODEL into the ollama volume, then exits.
  # The first run downloads ~2 GB for the default model; later runs are instant.
  ollama-pull:
    image: ollama/ollama:0.35.0
    container_name: jobtracker-ollama-pull
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - jobtracker-net

volumes:
  postgres-data:
  minio-data:
  ollama-data:

networks:
  jobtracker-net:
    driver: bridge
