spring:
  application:
    name: job-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
    username: ${DB_USERNAME:jobtracker}
    password: ${DB_PASSWORD:jobtracker}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-minimum-32-chars-long!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:resumes}
  ai:
    # Active AI provider: mock (default; offline and deterministic) | ollama | claude
    provider: ${AI_PROVIDER:mock}
    # Upper bound on resume text and job description length sent to the provider
    max-input-chars: ${AI_MAX_INPUT_CHARS:50000}
    # Used only when provider=ollama. Ollama does not need to be running for the app to start.
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:3b}
      connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:5s}
      # CPU-only machines can need a minute or more per analysis
      read-timeout: ${OLLAMA_READ_TIMEOUT:180s}
      temperature: ${OLLAMA_TEMPERATURE:0.2}
      num-ctx: ${OLLAMA_NUM_CTX:8192}
      num-predict: ${OLLAMA_NUM_PREDICT:1024}
    # Used only when provider=claude. Calls are billed to the Anthropic account behind the key.
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      model: ${CLAUDE_MODEL:claude-opus-5-5}
      effort: ${CLAUDE_EFFORT:medium}
      max-tokens: ${CLAUDE_MAX_TOKENS:16000}
      timeout: ${CLAUDE_TIMEOUT:120s}
      max-retries: ${CLAUDE_MAX_RETRIES:2}

logging:
  level:
    com.jobtracker: DEBUG
    org.flywaydb: INFO
    org.springframework.security: WARN
